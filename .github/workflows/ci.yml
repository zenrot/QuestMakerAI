name: CI


on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - name: Run unit tests
        working-directory: QuestMakerAI
        run: go test -v ./...
